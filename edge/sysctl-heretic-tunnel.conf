# EDGE. /etc/sysctl.d/60-heretic-tunnel.conf. The SSH tunnel to the GPU pod crosses a long, lossy path (Manila to a
# US pod: ~200 ms, measured 2.8% of bytes retransmitted with cubic). BBR keeps throughput under random loss, and not
# restarting slow start after idle stops every agent turn's prompt from starting at a 10-packet window.
# Remove this file and run `sysctl --system` to go back to the Debian defaults (cubic, fq_codel, slow start after idle).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
