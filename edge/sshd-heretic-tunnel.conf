# EDGE. /etc/ssh/sshd_config.d/20-heretic-tunnel.conf. The GPU pod's tunnel account: it may only open the one
# reverse forward that Caddy uses, on loopback. No shell, no TTY, no other forwarding.
Match User heretic-tunnel
	AllowTcpForwarding remote
	PermitListen 127.0.0.1:18443
	PermitOpen none
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
	ForceCommand /usr/sbin/nologin
	# drop a dead pod connection within ~45 s so the pod can re-bind the port after a network blip
	ClientAliveInterval 15
	ClientAliveCountMax 3

# End the Match block explicitly: nothing after this file may become tunnel-only.
Match all
